<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Succès et quêtes Dofus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Style inspiré des fenêtres de Dofus 3 : panneaux sombres, barre de titre bordeaux, accents dorés, vert pour le fait. */
:root{
  --bg:#ece6da; --win:#fbf8f2; --win2:#f3eee4; --row-h:#efe8da; --sec:#e7dfcf; --line:#ddd3c1;
  --text:#2a2620; --muted:#756d60; --dim:#a39a8b;
  --title1:#7a3550; --title2:#5a2338; --title-text:#fff6ea;
  --gold:#b8860b; --gold-hi:#d9a92e; --gold-txt:#8a6408; --green:#4f9a2a; --green-hi:#6fb33a; --red:#c0392b; --orange:#d9772b;
  --detail1:#f6f0e3; --detail2:#efe6d3; --quote:#e9dfca;
  --surface:var(--win); --surface2:var(--win2); --border:var(--line); --accent:var(--gold-txt); --accent-soft:#f3e4bd;
  --t1:var(--green); --t1s:#e3f0d6; --t4:var(--red); --tn:var(--muted); --tns:var(--sec);
  --shadow:0 6px 18px rgba(60,40,10,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111215; --win:#1b1d22; --win2:#202329; --row-h:#262a31; --sec:#272a30; --line:#2e3239;
    --text:#e6e3dc; --muted:#8d9098; --dim:#5e626b;
    --title1:#4a2333; --title2:#2d1820; --title-text:#fff;
    --gold:#f0c53a; --gold-hi:#f7dc7a; --gold-txt:#f0c53a; --green:#8ccf4d; --green-hi:#a6e06a; --red:#e0605a; --orange:#e0832f;
    --detail1:#24221e; --detail2:#1d1c19; --quote:#3a362e;
    --accent-soft:rgba(240,197,58,.14); --t1s:rgba(140,207,77,.12);
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#111215; --win:#1b1d22; --win2:#202329; --row-h:#262a31; --sec:#272a30; --line:#2e3239;
  --text:#e6e3dc; --muted:#8d9098; --dim:#5e626b;
  --title1:#4a2333; --title2:#2d1820; --title-text:#fff;
  --gold:#f0c53a; --gold-hi:#f7dc7a; --gold-txt:#f0c53a; --green:#8ccf4d; --green-hi:#a6e06a; --red:#e0605a; --orange:#e0832f;
  --detail1:#24221e; --detail2:#1d1c19; --quote:#3a362e;
  --accent-soft:rgba(240,197,58,.14); --t1s:rgba(140,207,77,.12);
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none !important}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:16px 16px 48px}
.muted{color:var(--muted)}
.sp{flex:1}

/* ---------- fenêtres ---------- */
.win{background:var(--win);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.win-t{display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(180deg,var(--title1),var(--title2));color:var(--title-text)}
.win-t h1{margin:0;font-size:1.08rem;font-weight:800;letter-spacing:.01em}
.win-t .ic{color:#f0c53a;font-weight:900}
.win-t .sub{font-size:.75rem;opacity:.7}
.win-t .btn{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.14);color:var(--title-text)}
.win-t .btn:hover{background:rgba(0,0,0,.4)}

/* ---------- boutons ---------- */
.btn{font-weight:800;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--text);background:var(--win2);border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:linear-gradient(180deg,#e0832f,#b85d1c);border-color:#8c4513;color:#fff}
.btn.danger{background:linear-gradient(180deg,#d65a4f,#a8352c);border-color:#7a2219;color:#fff}
.prof-btn{text-transform:none;letter-spacing:0;font-size:.85rem;border-radius:999px;padding:4px 12px}

/* ---------- en-tête : plaque dorée, niveau, progression ---------- */
.plaque-wrap{display:flex;justify-content:center;padding:16px 16px 2px;position:relative}
.plaque-wrap:before{content:"";position:absolute;left:16px;right:16px;top:50%;margin-top:7px;height:2px;background:linear-gradient(90deg,transparent,#a07b22 25%,#e9c25a 50%,#a07b22 75%,transparent)}
.plaque{position:relative;display:flex;align-items:baseline;gap:8px;padding:6px 36px;background:linear-gradient(180deg,#f7dc7a,#d9a92e 55%,#b9861a);color:#3a2808;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
.pl-n{font-weight:900;font-size:1.45rem;font-variant-numeric:tabular-nums}
.pl-s{font-weight:700;font-size:.85rem;opacity:.8}
.sum{display:grid;grid-template-columns:auto 1fr 1fr;gap:22px;align-items:center;padding:12px 18px 16px}
.lvl{position:relative;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 50% 35%,var(--win2),var(--win));border:2px solid var(--gold);cursor:text}
.lvl input{width:46px;border:0;background:none;text-align:center;font-weight:900;font-size:1.15rem;color:var(--gold-txt);padding:0;margin-top:-6px;-moz-appearance:textfield}
.lvl input::-webkit-inner-spin-button,.lvl input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.lvl small{position:absolute;bottom:9px;font-size:.55rem;color:var(--muted);letter-spacing:.1em;font-weight:800}
.prog .l{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:5px}
.prog .l b{color:var(--text);font-size:.98rem}
.bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-hi))}
.bar.gold i{background:linear-gradient(90deg,var(--gold),var(--gold-hi))}

/* ---------- Dofus ---------- */
.dz-sec{border-top:1px solid var(--line);padding:10px 18px 14px}
.dz-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dz-head h2{margin:0;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.dz-head .cnt{font-size:.8rem;color:var(--muted)}
.help{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:.7rem;font-weight:800;color:var(--muted);cursor:help}
.dz-wrap{overflow-x:auto;padding:2px 0 6px}
.dz-grid{display:flex;gap:8px}
.dz{position:relative;flex:none;width:84px;padding:16px 4px 6px;text-align:center;border-radius:8px;background:var(--win2);border:1px solid var(--line);cursor:pointer;user-select:none}
.dz img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto}
.dz.miss img{filter:grayscale(1) brightness(.8);opacity:.45}
.dz.miss .dz-n{color:var(--muted)}
.dz.own{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--gold) 18%,transparent),var(--win2) 70%)}
.dz.goal{outline:2px solid var(--orange);outline-offset:-1px}
.dz.goal img{filter:none;opacity:1}
.dz-n{font-size:.7rem;font-weight:700;margin-top:3px;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center}
.dz-lv{position:absolute;top:3px;left:0;right:0;font-size:.62rem;font-weight:800;color:var(--gold-txt)}
.dz-hors{position:absolute;top:3px;right:4px;font-size:.55rem;color:var(--muted)}
.dz-ctl{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:.66rem;gap:2px}
.dz-ctl label{display:flex;align-items:center;gap:2px;cursor:pointer;color:var(--muted)}
.dz-ok{color:var(--green);font-weight:800}
.dz-tg{border:1px solid var(--line);background:var(--win);border-radius:4px;font-size:.7rem;padding:0 5px;cursor:pointer;color:var(--muted)}
.dz-tg:hover{border-color:var(--gold);color:var(--text)}
.goalchips{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.goalchips img{width:18px;height:18px;object-fit:contain}
.dz-next{margin-top:8px}
.sugg{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sugg:last-child{border-bottom:0}
.sugg .left{font-size:.78rem;color:var(--muted)}

/* ---------- corps : catégories | liste | détail ---------- */
.body{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;align-items:stretch}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sc-modes{display:flex;justify-content:center;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.sc-mode{border:0;background:none;padding:8px 14px;font-weight:800;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.sc-mode[aria-pressed="true"]{color:var(--gold-txt);border-color:var(--gold)}
.search{margin:10px}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:.86rem}
#scTree{overflow:auto;padding-bottom:8px;max-height:calc(100vh - 120px);position:sticky;top:0}
.sc-cat{display:flex;justify-content:space-between;gap:8px;padding:7px 14px;font-size:.88rem;cursor:pointer;border-left:3px solid transparent}
.sc-cat:hover{background:var(--row-h)}
.sc-cat.sel{background:linear-gradient(90deg,var(--accent-soft),transparent);border-left-color:var(--gold);font-weight:800}
.sc-cat .pct{font-size:.78rem;font-weight:800;color:var(--gold-txt);font-variant-numeric:tabular-nums}
.sc-cat.full .pct{color:var(--green)}
.sc-main{min-width:0;display:flex;flex-direction:column}
.sc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.sc-head h2{margin:0;font-size:1rem;font-weight:800}
.sc-head .n{font-size:.8rem;color:var(--muted)}
.sc-head .btn{font-size:.66rem;padding:4px 8px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.sec{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--sec);color:var(--muted);font-size:.8rem;font-weight:700;border-bottom:1px solid var(--line)}
.sec img{width:20px;height:20px;object-fit:contain}
.sec .sgo{color:var(--text)}

/* lignes */
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--row-h)}
.row.sel{background:linear-gradient(90deg,var(--accent-soft),transparent 80%);box-shadow:inset 3px 0 0 var(--gold)}
.row.flash{animation:flash 1.4s}
@keyframes flash{0%,60%{background:color-mix(in srgb,var(--gold) 30%,transparent)}}
.row .t{font-size:.9rem;font-weight:600}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row .m{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;align-items:center;gap:10px;white-space:nowrap}
.row .lv{color:var(--gold-txt);font-size:.8rem;font-weight:800}
.row .grp{font-size:.7rem;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.arow{grid-template-columns:42px 1fr auto}
.arow img{width:40px;height:40px;object-fit:contain;border-radius:6px}
.mini{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);min-width:90px}
.mini .bar{flex:1;height:5px;min-width:50px}
.rew-ic{width:22px;height:22px;object-fit:contain}

/* cases à cocher façon jeu */
input.gc{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:0;border:1.5px solid var(--dim);border-radius:4px;background:var(--win);cursor:pointer;display:inline-grid;place-items:center}
input.gc:hover{border-color:var(--gold)}
input.gc:checked{background:var(--green);border-color:var(--green)}
input.gc:checked:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
input.gc.round{border-radius:50%}
input.gc.av:not(:checked){border-color:var(--green);box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 9px color-mix(in srgb,var(--green) 35%,transparent)}
input.gc.lock:not(:checked){border-style:dashed}
input.gc:disabled{opacity:.6;cursor:default}

/* ---------- panneau de détail ---------- */
.det{border-left:1px solid var(--line);background:linear-gradient(180deg,var(--detail1),var(--detail2));min-width:0}
.det-in{position:sticky;top:0;max-height:100vh;overflow:auto;padding-bottom:16px}
.det .hd{text-align:center;padding:18px 18px 4px}
.det .hd img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 6px}
.det .hd h3{margin:0;font-size:1.15rem;font-weight:800}
.det .hd .k{font-size:.75rem;color:var(--muted);margin-top:2px}
.orn{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold-txt);font-weight:900;margin:8px 0 2px;font-size:.85rem}
.orn:before,.orn:after{content:"";height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--dim),transparent)}
.quote{margin:8px 16px;padding:10px 14px;border:1px solid var(--quote);border-radius:6px;background:color-mix(in srgb,var(--quote) 30%,transparent);font-style:italic;font-size:.88rem}
.quote.ok{border-color:color-mix(in srgb,var(--green) 50%,var(--quote))}
.quote.ko{border-color:color-mix(in srgb,var(--red) 45%,var(--quote))}
.lab{font-weight:800;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 16px 6px}
.ob{display:flex;align-items:center;gap:10px;padding:5px 16px;font-size:.88rem}
.ob.done > span{color:var(--muted);text-decoration:line-through}
.ob .x{width:18px;text-align:center;font-weight:900;flex:none}
.ob .x.ok{color:var(--green)}
.ob .x.ko{color:var(--red)}
.ob .lv{margin-left:auto;color:var(--gold-txt);font-size:.75rem;font-weight:800;white-space:nowrap}
.det .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px 16px 0}
.det .path{text-align:center;font-size:.75rem;color:var(--muted);padding:10px 16px 0}
.det-empty{padding:60px 24px;text-align:center;color:var(--muted)}
.rwd{margin:14px 16px 0;border-top:1px solid var(--quote);padding-top:10px;text-align:center}
.rwd .lab{padding:0 0 8px;display:flex;align-items:center;justify-content:center;gap:8px}
.rwd .lab:before,.rwd .lab:after{content:"•";color:var(--dim)}
.rew{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:8px;border:1px solid var(--gold);background:radial-gradient(circle at 20% 50%,var(--accent-soft),transparent 70%);font-weight:800;font-size:.85rem;margin:2px}
.rew img{width:26px;height:26px;object-fit:contain}
.sgo{color:var(--gold-txt);cursor:pointer;font-weight:700}
.sgo:hover{text-decoration:underline}
.badge{display:inline-block;border-radius:4px;padding:0 6px;font-size:.7rem;font-weight:800;white-space:nowrap;vertical-align:1px}
.badge.avail{color:var(--green);border:1px solid var(--green)}
.bn{color:var(--muted);border:1px solid var(--line)}

/* ---------- pied : options d'affichage ---------- */
.foot{grid-column:1 / -1;display:flex;gap:22px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--win2)}
.foot label{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;color:var(--gold-txt);font-weight:600;cursor:pointer}
.foot .note{margin-left:auto;font-size:.75rem;color:var(--muted)}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);cursor:pointer}

/* ---------- fenêtres modales ---------- */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--win);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
dialog::backdrop{background:rgba(8,6,4,.6)}
#cfDialog{width:min(460px,calc(100vw - 24px))}
#pfDialog{width:min(520px,calc(100vw - 24px))}
#scDialog{width:min(760px,calc(100vw - 24px));max-height:min(86vh,900px)}
#scDialog[open]{display:flex;flex-direction:column}
.dl-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(180deg,var(--title1),var(--title2));color:var(--title-text);font-weight:800}
.dl-head{display:flex;gap:12px;align-items:center;padding:14px 16px 6px}
.dl-head img{width:48px;height:48px;object-fit:contain}
.dl-head h2{margin:0;font-size:1.1rem}
.dl-sum{padding:6px 16px;font-size:.9rem}
.dl-sum b{color:var(--gold-txt)}
.dl-tools{padding:0 16px 8px;display:flex;gap:6px;flex-wrap:wrap}
.dl-tools .btn{font-size:.66rem;padding:3px 8px}
.dl-body{overflow:auto;padding:4px 16px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:1;min-height:120px}
.dl-body ul{list-style:none;margin:0;padding:0 0 0 22px}
.dl-body > ul{padding-left:0}
.dl-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:.88rem}
.dl-row input{flex:none}
.dl-row.done{color:var(--muted)}
.dl-row.done .dl-lbl{text-decoration:line-through}
.dl-row.off .dl-lbl{color:var(--muted)}
.dl-tog{width:20px;height:20px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:.8rem;padding:0;flex:none}
.dl-tog.empty{visibility:hidden}
.dl-ach{font-weight:700}
.dl-ach img{width:20px;height:20px;object-fit:contain;vertical-align:-5px;margin-right:3px}
.dl-kind{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.dl-foot{display:flex;gap:8px;padding:10px 16px;align-items:center;flex-wrap:wrap}
.pf-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.pf-row:last-child{border-bottom:0}
.pf-row.cur .pf-n{font-weight:800}
.pf-main{flex:1;min-width:0}
.pf-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-meta{font-size:.78rem;color:var(--muted)}
.pf-row input[type=text]{width:100%;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.pf-row .btn{font-size:.64rem;padding:3px 8px}
.pf-new{display:flex;gap:8px;padding:10px 16px 0}
.pf-new input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}

/* ---------- petits écrans ---------- */
@media (max-width:1100px){
  .body{grid-template-columns:220px minmax(0,1fr)}
  .det{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)}
  .det-in{position:static;max-height:none}
}
@media (max-width:700px){
  .body{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  #scTree{max-height:240px;position:static}
  .sum{grid-template-columns:auto 1fr;gap:14px}
  .sum .prog:last-child{grid-column:1 / -1}
  .win-t .sub{display:none}
  .row .m{white-space:normal}
}
input[type=checkbox]:not(.gc){accent-color:var(--gold)}
</style>

<body>
<div class="wrap">
  <section class="win">
    <header class="win-t">
      <span class="ic">★</span><h1>Succès &amp; quêtes</h1><span class="sub" id="sub"></span>
      <span class="sp"></span>
      <button class="btn prof-btn" id="profBtn" title="Changer de personnage, gérer les profils, exporter ou importer"></button>
      <button class="btn" id="theme" title="Changer de thème"></button>
    </header>
    <div class="plaque-wrap"><div class="plaque" title="Quêtes faites"><span class="pl-n" id="plN"></span><span class="pl-s" id="plS"></span></div></div>
    <div class="sum">
      <label class="lvl" title="Ton niveau : sert à savoir quelles quêtes sont disponibles"><input type="number" id="scLevel" min="1" max="200" aria-label="Mon niveau"><small>NIVEAU</small></label>
      <div class="prog" id="progQ"></div>
      <div class="prog" id="progA"></div>
    </div>
    <div class="dz-sec" id="scHelp"></div>
  </section>

  <dialog id="pfDialog" aria-labelledby="pfTitle">
    <div class="dl-bar"><span id="pfTitle">Profils</span></div>

let AVAIL = new Map();
function achAvailNow(id, stack = new Set()){
  if (AVAIL.has(id)) return AVAIL.get(id);
  if (stack.has(id)) return false;
  const a = SACH[id]; if (!a) return false;
  if (sdone.has(id) || achDone(id)) { AVAIL.set(id, true); return true; }
  // Indisponible tant qu'un sous-succès exigé n'est pas fini ; sinon disponible si un objectif restant est faisable maintenant.
  const obs = a.ob.map(oid => [oid, SC.objectifs[oid]]).filter(([, o]) => o);
  if (obs.some(([oid, o]) => o.t === 'a' && !objDone(oid))) { AVAIL.set(id, false); return false; }
  stack.add(id);
  const r = obs.some(([oid, o]) => {
    if (objDone(oid)) return false;
    if (o.t === 'q') return qAvailNow(o.r);
    if (o.t === 'lvl') return sLevel >= o.r;
    return true; });
  stack.delete(id); AVAIL.set(id, r); return r;
}

    for (const k of PKEYS) raw.del(`p:${id}:${k}`);
    profiles = profiles.filter(p => p.id !== id); raw.set('profiles', profiles);
    if (id === profile) switchProfile(profiles[0].id); else renderProfiles();
  }
});
pfDlg.addEventListener('keydown', e => {
  const inp = e.target.closest('[data-pfname]'); if (!inp) return;
  if (e.key === 'Enter') { e.preventDefault(); saveName(inp.dataset.pfname); }
  else if (e.key === 'Escape') { e.preventDefault(); pfEdit = null; renderProfiles(); }
});
document.getElementById('pfNewForm').onsubmit = e => {
  e.preventDefault();
  const n = document.getElementById('pfNewName').value.trim(); if (!n) { document.getElementById('pfNewName').focus(); return; }
  const id = 'p' + Date.now().toString(36);
  profiles.push({ id, n }); raw.set('profiles', profiles); switchProfile(id);
};
renderProfiles();
renderSub();
renderSucces();
</script>
</body>
</html>
